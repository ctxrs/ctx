[workspace]
members = [
    "crates/ctx-cli",
    "crates/ctx-history-capture",
    "crates/ctx-history-core",
    "crates/ctx-history-index",
    "crates/ctx-history-store",
    "crates/ctx-pro-host-protocol",
    "crates/ctx-protocol",
    "crates/ctx-sdk",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ctxrs/ctx"
homepage = "https://github.com/ctxrs/ctx"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_mangen = "0.2"
directories = "5.0"
ed25519-dalek = "2.1"
json5 = { version = "0.4", default-features = false }
jsonc-parser = { version = "0.33", default-features = false, features = ["serde", "serde_json"] }
libc = "0.2"
memmap2 = "0.9"
predicates = "3.1"
proptest = "1"
regex = "1.10"
ring = "0.17"
rmpv = "1.3"
rusqlite = { version = "0.32", features = ["bundled", "functions", "hooks", "limits", "serialize"] }
quick-xml = { version = "0.38", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde_yaml = { version = "0.9", default-features = false }
semver = "1.0"
sha2 = "0.10"
tantivy = { version = "0.26.1", default-features = false, features = ["mmap", "lz4-compression", "columnar-zstd-compression"] }
tempfile = "3.10"
thiserror = "1.0"
toml_edit = { version = "0.22", default-features = false, features = ["parse", "serde"] }
tar = "0.4"
url = "2.5"
uuid = { version = "1.10", features = ["serde", "v4", "v7"] }
ureq = { version = "2.10", default-features = true }
xz2 = "0.1"
zeroize = "1.8"
zstd = "0.13"

[patch.crates-io]
# `ort` 2.0.0-rc.12 lacks FreeBSD dynamic loading and can recursively deadlock
# while reporting a loader failure. This pin carries only those upstream fixes.
# Drop the patch once a crates.io release includes both.
ort = { git = "https://github.com/ctxrs/ort.git", rev = "f7994dc91b8f48c78afc506880b3f9f558957919" }

[profile.release]
# Distributed binaries must omit local/static symbols and debug symbol data.
# The artifact compatibility gate enforces the resulting binary contract
# independently of the implementation language used to build the CLI.
strip = "symbols"
