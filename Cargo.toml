[workspace]
members = [
    "crates/ctx-agent-application",
    "crates/ctx-agent-integrations",
    "crates/ctx-companion-bridge",
    "crates/ctx-cli",
    "crates/ctx-cli-contract-tests",
    "crates/ctx-cli-presentation",
    "crates/ctx-cli-qualification",
    "crates/ctx-client-observability",
    "crates/ctx-daemon-cli",
    "crates/ctx-daemon-application",
    "crates/ctx-daemon-service",
    "crates/ctx-daemon-runtime",
    "crates/ctx-managed-pair-engine",
    "crates/ctx-upgrade-engine",
    "crates/ctx-history-capture",
    "crates/ctx-history-capture-composition",
    "crates/ctx-history-capture-composition-qualification",
    "crates/ctx-history-provider-hermes",
    "crates/ctx-history-provider-gemini",
    "crates/ctx-history-provider-native-jsonl",
    "crates/ctx-history-capture-model",
    "crates/ctx-history-capture-runtime",
    "crates/ctx-history-provider-docproj",
    "crates/ctx-history-provider-fx",
    "crates/ctx-history-provider-runtime",
    "crates/ctx-history-provider-claude-cursor",
    "crates/ctx-history-provider-codex",
    "crates/ctx-history-provider-mistral-mux",
    "crates/ctx-history-openclaw-schema",
    "crates/ctx-history-provider-openclaw-sqlite",
    "crates/ctx-history-providers-sqlite-inventory",
    "crates/ctx-history-providers-sqlite-logical",
    "crates/ctx-history-ingest-application",
    "crates/ctx-history-core",
    "crates/ctx-history-platform",
    "crates/ctx-history-cli",
    "crates/ctx-history-index",
    "crates/ctx-history-index-qualification",
    "crates/ctx-history-index-format",
    "crates/ctx-history-index-generation",
    "crates/ctx-history-index-query",
    "crates/ctx-history-snapshot-reader",
    "crates/ctx-history-jsonl",
    "crates/ctx-history-providers-jsonl-shared",
    "crates/ctx-history-providers-task-docs",
    "crates/ctx-history-native-jsonl-parsers",
    "crates/ctx-deepseek-harness-qualification",
    "crates/ctx-history-read-application",
    "crates/ctx-history-refresh",
    "crates/ctx-history-refresh-execution",
    "crates/ctx-history-providers-sqlite-selected",
    "crates/ctx-history-source-io",
    "crates/ctx-history-source-sqlite",
    "crates/ctx-history-source-discovery",
    "crates/ctx-history-source-discovery-qualification",
    "crates/ctx-semantic-index",
    "crates/ctx-semantic-model",
    "crates/ctx-terminal",
    "crates/ctx-protocol",
    "crates/ctx-sdk",
]
resolver = "2"

[workspace.metadata.cargo-shear]
# These sources are linked through explicit #[path] attributes or standalone
# Bazel targets, which Cargo's module-tree view cannot discover.
ignored-paths = [
    "crates/ctx-cli-contract-tests/tests/contracts/support/setup_sources_import/lifecycle_helpers.rs",
    "crates/ctx-cli-contract-tests/tests/contracts/support/upgrade/runtime_publication.rs",
    "crates/ctx-history-capture/src/provider/providers/nanoclaw/native_path.rs",
    "crates/ctx-history-capture/src/provider/providers/openhands/nativepath.rs",
    "crates/ctx-history-index-format/src/verification/logical_body_projection.rs",
    "crates/ctx-history-index-format/src/verification/logical_identity.rs",
    "crates/ctx-history-provider-claude-cursor/src/tests/runtime.rs",
    "crates/ctx-history-refresh/src/explicit_source_catalog/codex_union.rs",
    "crates/ctx-upgrade-engine/tests/contracts/support.rs",
    "crates/ctx-upgrade-engine/tests/contracts/upgrade.rs",
    "crates/ctx-upgrade-engine/tests/fixtures/v025_upgrade_fixture.rs",
]

[workspace.package]
version = "1.2.4"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ctxrs/ctx"
homepage = "https://github.com/ctxrs/ctx"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
anstream = "1.0"
anstyle = "1.0"
assert_cmd = "2.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
jiff = "0.2"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_mangen = "0.2"
ctrlc = { version = "3.5.2", features = ["termination"] }
directories = "5.0"
json5 = { version = "0.4", default-features = false }
jsonc-parser = { version = "0.33", default-features = false, features = ["serde", "serde_json"] }
libc = "0.2"
memmap2 = "0.9"
notify = "=9.0.0-rc.4"
predicates = "3.1"
proptest = "1"
ring = "0.17"
rmpv = "1.3"
rusqlite = { version = "0.32", features = ["bundled", "functions", "hooks", "limits", "serialize"] }
quick-xml = { version = "0.41.0", default-features = false }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde_yaml = { version = "0.9", default-features = false }
semver = "1.0"
sha2 = "0.10"
supports-unicode = "3.0"
tantivy = { version = "0.26.1", default-features = false, features = ["mmap", "lz4-compression", "zstd-compression", "columnar-zstd-compression"] }
tempfile = "3.10"
terminal_size = "0.4"
thiserror = "1.0"
toml_edit = { version = "0.22", default-features = false, features = ["parse", "serde"] }
tar = "0.4"
url = "2.5"
uuid = { version = "1.10", features = ["serde", "v4", "v7"] }
ureq = { version = "2.10", default-features = true }
ureq-semantic = { package = "ureq", version = "3.3", default-features = false, features = ["platform-verifier", "rustls"] }
unicode-width = "0.2"
unicode-segmentation = "1.12"
xz2 = "0.1"
zstd = "0.13"

[patch.crates-io]
# `ort` 2.0.0-rc.12 lacks FreeBSD dynamic loading and can recursively deadlock
# while reporting a loader failure. This pin carries only those upstream fixes.
# Drop the patch once a crates.io release includes both.
ort = { git = "https://github.com/ctxrs/ort.git", rev = "f7994dc91b8f48c78afc506880b3f9f558957919" }

[profile.release]
# Distributed binaries must omit local/static symbols and debug symbol data.
# The artifact compatibility gate enforces the resulting binary contract
# independently of the implementation language used to build the CLI.
strip = "symbols"
