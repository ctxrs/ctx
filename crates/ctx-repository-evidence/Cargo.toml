[package]
name = "ctx-repository-evidence"
version.workspace = true
edition = "2024"
description = "Bounded repository interpretation and Git evidence for ctx"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ctx-attribution-model = { path = "../ctx-attribution-model" }
ctx-history-capture-model = { path = "../ctx-history-capture-model" }
ctx-history-core = { path = "../ctx-history-core" }
chrono.workspace = true
libc.workspace = true
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_parser.workspace = true
oxc_semantic.workspace = true
oxc_span.workspace = true
oxc_syntax.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
url.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unsafe_code = "deny"
