[package]
name = "ctx-cli-contract-tests"
version = "1.0.0"
description = "Bazel-owned final-binary contracts and shared test support for ctx"
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

# Cargo preserves cross-platform all-target compilation for these final-binary
# contracts. Bazel remains the execution authority and supplies the ctx binary.
[[test]]
name = "cli_public_help_docs"
path = "tests/contracts/cli_public_help_docs.rs"

[[test]]
name = "hosted_uninstall_fence"
path = "tests/contracts/hosted_uninstall_fence.rs"

[[test]]
name = "native_provider_real_shapes"
path = "tests/contracts/native_provider_real_shapes.rs"

[[test]]
name = "native_provider_rejections"
path = "tests/contracts/native_provider_rejections.rs"

[[test]]
name = "native_providers"
path = "tests/contracts/native_providers.rs"

[[test]]
name = "provider_support_conformance"
path = "tests/contracts/provider_support_conformance.rs"

[[test]]
name = "setup_sources_import"
path = "tests/contracts/setup_sources_import.rs"

[dev-dependencies]
anstream.workspace = true
assert_cmd.workspace = true
base64.workspace = true
chrono.workspace = true
ctx-history-core = { path = "../ctx-history-core" }
ctx-history-index = { path = "../ctx-history-index" }
flate2 = "1"
fs2 = "0.4.3"
libc.workspace = true
predicates.workspace = true
ring.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[lints.rust]
# Bazel passes these cfgs for its owned test wiring (binary binding, fixture
# selection, upgrade fixtures); plain cargo builds never set them, so declare
# them for check-cfg.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(ctx_cli_bazel_test)',
    'cfg(ctx_cli_test_support_fixtures)',
    'cfg(ctx_cli_test_support_upgrade)',
] }
