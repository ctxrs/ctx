[package]
name = "ctx-graph-types"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Local graph types for the ctx CLI"
license = "Apache-2.0"
repository.workspace = true
homepage.workspace = true
keywords = ["code-graph", "code-search", "mcp", "knowledge-graph"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "ctx_graph_types"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.27"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
