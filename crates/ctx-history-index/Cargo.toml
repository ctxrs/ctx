[package]
name = "ctx-history-index"
version.workspace = true
description = "Atomic source-backed lexical generations for ctx"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[features]
test-support = [
    "ctx-history-index-format/test-support",
    "ctx-history-index-generation/test-support",
    "ctx-history-index-query/test-support",
]

[dependencies]
base64.workspace = true
ctx-history-core = { path = "../ctx-history-core" }
ctx-history-index-format = { path = "../ctx-history-index-format" }
ctx-history-index-generation = { path = "../ctx-history-index-generation" }
ctx-history-index-query = { path = "../ctx-history-index-query" }
ctx-history-platform = { path = "../ctx-history-platform" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tantivy.workspace = true
tempfile.workspace = true
uuid.workspace = true

[dev-dependencies]
crc32fast = "1.5"
ctx-history-index-format = { path = "../ctx-history-index-format", features = ["test-support"] }
ctx-history-index-generation = { path = "../ctx-history-index-generation", features = ["test-support"] }
ctx-history-index-query = { path = "../ctx-history-index-query", features = ["test-support"] }
libc.workspace = true
