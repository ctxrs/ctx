[package]
name = "ctx-graph-configs"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Local graph configs for the ctx CLI"
license = "Apache-2.0"
repository.workspace = true
homepage.workspace = true
keywords = ["code-graph", "code-search", "mcp", "knowledge-graph"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "ctx_graph_configs"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
globset = "0.4"
serde_json = "1"
toml_edit = "0.23"
tree-sitter = "0.27"
tree-sitter-sequel = "0.3.11"
tree-sitter-hcl = "1.1.0"
serde_yaml_ng = "0.10"
quick-xml = "0.41"
ctx_graph_types = { package = "ctx-graph-types", path = "../ctx-graph-types" }
