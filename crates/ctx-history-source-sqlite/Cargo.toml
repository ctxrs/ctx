[package]
name = "ctx-history-source-sqlite"
version = "1.0.0"
description = "Provider-neutral SQLite source acquisition and snapshots for ctx history"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
test-support = []

[dependencies]
ctx-history-core = { path = "../ctx-history-core" }
ctx-history-platform = { path = "../ctx-history-platform" }
ctx-history-source-io = { path = "../ctx-history-source-io" }
fs2 = "0.4.3"
libc.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
] }
