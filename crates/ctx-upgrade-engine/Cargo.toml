[package]
name = "ctx-upgrade-engine"
version.workspace = true
description = "Internal release upgrade engine for ctx"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cargo-shear]
# The Bazel-only v0.25 upgrade fixture consumes this dependency.
ignored = ["fs2"]

[features]
test-support = []

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
ctx-history-core = { path = "../ctx-history-core" }
ctx-history-platform = { path = "../ctx-history-platform" }
ctx-managed-pair-engine = { path = "../ctx-managed-pair-engine" }
fs2 = "0.4.3"
ring.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
url.workspace = true
uuid.workspace = true
xz2.workspace = true
zstd.workspace = true

[target.'cfg(unix)'.dependencies]
flate2 = "1"
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
