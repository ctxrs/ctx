<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>__TITLE__</title><style>
:root{font:16px system-ui;color-scheme:light dark}body{max-width:1100px;margin:2rem auto;padding:0 1rem}input,button{font:inherit;padding:.5rem;margin:.3rem}details{margin:.5rem 0 .5rem 1rem;border-left:2px solid #8793a5;padding-left:.8rem}summary{cursor:pointer}table{border-collapse:collapse;width:100%;overflow-wrap:anywhere}th,td{border:1px solid #8793a5;padding:.4rem;text-align:left}pre{white-space:pre-wrap;overflow-wrap:anywhere}svg{max-height:65vh;max-width:100%;background:#fff;color:#000}small{display:block;margin:.6rem 0}:focus-visible{outline:3px solid #eab308}[hidden]{display:none!important}
</style></head><body><h1>__TITLE__</h1><label>Search this report <input id="search" type="search"></label><button type="button" id="expand">Expand all</button><button type="button" id="collapse">Collapse all</button><main id="content">__BODY__</main><script>
'use strict';const search=document.getElementById('search');search.addEventListener('input',()=>{const query=search.value.toLocaleLowerCase();for(const row of document.querySelectorAll('[data-search]'))row.hidden=!!query&&!row.textContent.toLocaleLowerCase().includes(query);for(const branch of [...document.querySelectorAll('details[data-branch]')].reverse()){branch.hidden=!!query&&![...branch.querySelectorAll('[data-search]')].some(n=>!n.hidden);if(query&&!branch.hidden)branch.open=true;}});for(const [id,open] of [['expand',true],['collapse',false]])document.getElementById(id).addEventListener('click',()=>{for(const branch of document.querySelectorAll('details'))branch.open=open;});
</script></body></html>
