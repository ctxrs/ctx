[package]
name = "ctx-agent-integrations"
version.workspace = true
description = "Headless coding-agent integration protocols and installers for ctx"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
chrono.workspace = true
ctx-history-core = { path = "../ctx-history-core" }
fs2 = "0.4.3"
jsonc-parser = { version = "0.33", features = ["serde", "serde_json"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
sha2.workspace = true
toml_edit = "0.22"
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
tempfile.workspace = true
