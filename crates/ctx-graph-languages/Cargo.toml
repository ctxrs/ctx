[package]
name = "ctx-graph-languages"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Local graph languages for the ctx CLI"
license = "Apache-2.0"
repository.workspace = true
homepage.workspace = true
keywords = ["code-graph", "code-search", "mcp", "knowledge-graph"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "ctx_graph_languages"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-cuda = "=0.21.2"
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-swift = "0.7.3"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.24.2"
tree-sitter-lua = "0.5.0"
tree-sitter-luau = "1.2.0"
tree-sitter-bash = "0.25.1"
tree-sitter-powershell = "0.26.4"
tree-sitter-elixir = "0.3.5"
tree-sitter-scala = "0.26.2"
tree-sitter-dart = "0.2.0"
tree-sitter-objc = "3.0.2"
tree-sitter-julia = "0.23.1"
tree-sitter-fortran = "0.6.0"
tree-sitter-ocaml = "0.26.0"
tree-sitter-pascal = "0.10.2"
tree-sitter-commonlisp = "0.4.1"
tree-sitter-verilog = "1.0.3"
tree-sitter-zig = "1.1.2"
tree-sitter-groovy = "0.1.2"
tree-sitter-dm = "0.25.4"
tree-sitter-sfapex = "3.0.1"
pulldown-cmark = "0.13"
png = "0.18.1"
quick-xml = "0.41"
ctx_graph_types = { package = "ctx-graph-types", path = "../ctx-graph-types" }
ctx_graph_ingest = { package = "ctx-graph-ingest", path = "../ctx-graph-ingest" }
ctx_graph_python = { package = "ctx-graph-python", path = "../ctx-graph-python" }
ctx_graph_configs = { package = "ctx-graph-configs", path = "../ctx-graph-configs" }
