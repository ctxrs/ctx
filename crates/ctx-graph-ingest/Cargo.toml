[package]
name = "ctx-graph-ingest"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Local graph ingest for the ctx CLI"
license = "Apache-2.0"
repository.workspace = true
homepage.workspace = true
keywords = ["code-graph", "code-search", "mcp", "knowledge-graph"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "ctx_graph_ingest"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "net", "signal", "time"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
tempfile = "3"
pulldown-cmark = "0.13"
scraper = "0.27"
serde_yaml_ng = "0.10"
lopdf = { version = "0.45", default-features = false }
zip = { version = "4", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ctx_graph_types = { package = "ctx-graph-types", path = "../ctx-graph-types" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
