[package]
name = "ctx-history-capture"
version = "0.26.0"
description = "Internal provider import adapters for ctx local agent history"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(codex_nativepath_qualification)"] }

[dependencies]
base64.workspace = true
chrono.workspace = true
directories.workspace = true
json5.workspace = true
jsonc-parser.workspace = true
libc.workspace = true
quick-xml.workspace = true
rmpv.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml_edit.workspace = true
url.workspace = true
uuid.workspace = true
zstd.workspace = true
ctx-history-core = { path = "../ctx-history-core" }
ctx-history-index = { path = "../ctx-history-index" }
ctx-history-store = { path = "../ctx-history-store" }
ctx-pro-host-protocol = { path = "../ctx-pro-host-protocol" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
