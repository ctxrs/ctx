[package]
name = "ctx-graph-storage"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Local graph storage for the ctx CLI"
license = "Apache-2.0"
repository.workspace = true
homepage.workspace = true
keywords = ["code-graph", "code-search", "mcp", "knowledge-graph"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "ctx_graph_storage"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-normalization = "0.1.25"
ctx_graph_types = { package = "ctx-graph-types", path = "../ctx-graph-types" }
ctx_graph_languages = { package = "ctx-graph-languages", path = "../ctx-graph-languages" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
