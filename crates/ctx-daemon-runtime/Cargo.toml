[package]
name = "ctx-daemon-runtime"
version.workspace = true
description = "Process-neutral daemon runtime mechanics for ctx"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
base64.workspace = true
fs2 = "0.4.3"
notify.workspace = true
quick-xml.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
ctx-history-core = { path = "../ctx-history-core" }
ctx-history-platform = { path = "../ctx-history-platform" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_RestartManager",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
# Bazel passes --cfg ctx_release_qualification for the release-qualification
# build; plain cargo builds never set it, so declare it for check-cfg.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ctx_release_qualification)'] }
