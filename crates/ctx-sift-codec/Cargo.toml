[package]
name = "ctx-sift-codec"
version.workspace = true
description = "Sift output codec and embedded tokenizer"
edition = "2024"
license = "MIT"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "sift"
path = "src/lib.rs"

[package.metadata.cargo-shear]
# Exact transitive generator pins preserve the serialized tokenizer layout.
ignored = ["bpe", "aneubeck-daachorse"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
regex-automata = "=0.4.18"
rkyv = { version = "=0.8.18", features = ["little_endian", "aligned", "pointer_width_32"] }

[build-dependencies]
bpe-openai = "=0.3.1"
bpe = "=0.2.2"
aneubeck-daachorse = "=1.1.1"
rmp-serde = "=1.3.1"
serde.workspace = true
regex-automata = "=0.4.18"
rkyv = { version = "=0.8.18", features = ["little_endian", "aligned", "pointer_width_32"] }

[dev-dependencies]
bpe-openai = "=0.3.1"
tiktoken-rs = "0.12"
