[package]
name = "ctx-managed-pair-engine"
version.workspace = true
description = "Internal verifier-driven managed Core and companion publication engine for ctx"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
ctx-history-platform = { path = "../ctx-history-platform" }
ctx-terminal = { path = "../ctx-terminal" }
fs2 = "0.4.3"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
