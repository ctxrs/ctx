env:
  CARGO_TERM_COLOR: "always"
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "2"
  CTX_BOOTSTRAP_BAZELISK: "1"
  CTX_BAZELISK_VERSION: "v1.29.0"
  CTX_RUST_TOOLCHAIN: "1.97.1"

steps:
  - label: ":bazel: public smoke gate"
    key: "public-smoke"
    if: build.source != "schedule" && build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") != "1" && build.env("CTX_PUBLIC_SEMANTIC_ASSET_MATRIX") != "1"
    command: |
      bash scripts/buildkite-public-ci.sh --mode=ci
    agents:
      queue: "default"
    concurrency: 1
    concurrency_group: "ctx/public-smoke/default-hosted"
    timeout_in_minutes: 60
    artifact_paths:
      - "bazel-testlogs/**/*.log"
      - "bazel-testlogs/**/test.outputs/**/*"
      - "bazel-testlogs/**/*.zip"
      - "target/ctx-artifacts/check/**"

  - label: ":night_with_stars: public nightly performance and fault gate"
    key: "public-nightly"
    if: build.source == "schedule" && build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") != "1" && build.env("CTX_PUBLIC_SEMANTIC_ASSET_MATRIX") != "1"
    command: |
      bash scripts/buildkite-public-ci.sh --mode=nightly
    agents:
      queue: "default"
    concurrency: 1
    concurrency_group: "ctx/public-nightly/default-hosted"
    timeout_in_minutes: 120
    artifact_paths:
      - "bazel-testlogs/**/*.log"
      - "bazel-testlogs/**/test.outputs/**/*"
      - "bazel-testlogs/**/*.zip"
      - "target/ctx-artifacts/check/**"

  - label: ":rocket: public release qualification"
    key: "public-release"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      bash scripts/buildkite-public-ci.sh --mode=release
    agents:
      queue: "release-linux-managed"
      ctx-runner-class: "release-linux-control"
      ctx-release-os: "ubuntu-24.04"
      ctx-release-nested-docker: "true"
      ctx-release-task-bind: "true"
      ctx-release-unshare-clone-fs: "true"
      os: "linux"
      arch: "x86_64"
    concurrency: 1
    concurrency_group: "ctx/public-release/release-linux-managed"
    timeout_in_minutes: 120
    artifact_paths:
      - "bazel-testlogs/**/*.log"
      - "bazel-testlogs/**/test.outputs/**/*"
      - "bazel-testlogs/**/*.zip"
      - "target/ctx-artifacts/check/**"

  - label: ":swift: ordinary CI macOS Swift SDK implementation"
    key: "sdk-swift-required"
    if: build.source != "schedule" && build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") != "1" && build.env("CTX_PUBLIC_SEMANTIC_ASSET_MATRIX") != "1"
    command: |
      swift --version
      CTX_SDK_RUN_LOCAL_SMOKE=0 bash scripts/check-sdks.sh --groups=swift --required-groups=swift
    agents:
      queue: "ctx-release-macos-arm64"
      os: "darwin"
      arch: "arm64"
    concurrency: 1
    concurrency_group: "ctx/sdk-swift-required/ctx-release-macos-arm64"
    timeout_in_minutes: 30

  - label: ":package: five-platform public CLI factory on Linux"
    key: "public-cli-linux-factory"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      source_commit="$$(git rev-parse --verify HEAD^{commit})"
      scripts/release/build-public-candidate-on-linux.sh \
        --source-commit "$${source_commit}" \
        --macos-sdk "$${CTX_MACOS_SDK_ROOT:?}" \
        --output-dir target/public-cli-artifacts
    agents:
      queue: "release-linux-managed"
      ctx-runner-class: "release-linux-control"
      ctx-release-os: "ubuntu-24.04"
      ctx-release-nested-docker: "true"
      os: "linux"
      arch: "x86_64"
    timeout_in_minutes: 180
    artifact_paths:
      - "target/public-cli-artifacts/*"

  - label: ":test_tube: public CLI linux-x64 exact-byte validation"
    key: "public-cli-linux-x64-native-smoke"
    depends_on: "public-cli-linux-factory"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1" && build.env("CTX_PUBLIC_CLI_NATIVE_SMOKE_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      scripts/buildkite/download-linux-factory-artifacts.sh "ctx" "ctx.*"
      scripts/validate-public-cli-factory-artifact.sh \
        linux-x64 target/public-cli-artifacts \
        target/public-cli-native-smoke/linux-x64
    agents:
      queue: "release-linux-managed"
      ctx-runner-class: "release-linux-control"
      ctx-release-os: "ubuntu-24.04"
      ctx-release-nested-docker: "true"
      os: "linux"
      arch: "x86_64"
    env:
      CTX_PUBLIC_CLI_RUNTIME_AUTHORITY_BASELINE: "ubuntu-24.04"
    timeout_in_minutes: 60
    artifact_paths:
      - "target/public-cli-native-smoke/linux-x64/candidate-smoke.json"
      - "target/public-cli-native-smoke/linux-x64/ctx-linux-x64.native-execution.json"

  - label: ":test_tube: public CLI linux-aarch64 exact-byte validation"
    key: "public-cli-linux-aarch64-native-smoke"
    depends_on: "public-cli-linux-factory"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1" && build.env("CTX_PUBLIC_CLI_NATIVE_SMOKE_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      scripts/buildkite/download-linux-factory-artifacts.sh "ctx-linux-aarch64*"
      scripts/validate-public-cli-factory-artifact.sh \
        linux-aarch64 target/public-cli-artifacts \
        target/public-cli-native-smoke/linux-aarch64
    agents:
      queue: "linux-arm64"
      os: "linux"
      arch: "arm64"
    env:
      CTX_PUBLIC_CLI_RUNTIME_AUTHORITY_BASELINE: "ubuntu-24.04"
    timeout_in_minutes: 60
    artifact_paths:
      - "target/public-cli-native-smoke/linux-aarch64/candidate-smoke.json"
      - "target/public-cli-native-smoke/linux-aarch64/ctx-linux-aarch64.native-execution.json"

  - label: ":test_tube: public CLI macos-arm64 exact-byte validation"
    key: "public-cli-macos-arm64-native-smoke"
    depends_on: "public-cli-linux-factory"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1" && build.env("CTX_PUBLIC_CLI_NATIVE_SMOKE_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      scripts/buildkite/download-linux-factory-artifacts.sh "ctx-macos-arm64*"
      scripts/validate-public-cli-factory-artifact.sh \
        macos-arm64 target/public-cli-artifacts \
        target/public-cli-native-smoke/macos-arm64
    agents:
      queue: "ctx-release-macos-arm64"
      os: "darwin"
      arch: "arm64"
    concurrency: 1
    concurrency_group: "ctx-public-cli-macos-native"
    timeout_in_minutes: 90
    artifact_paths:
      - "target/public-cli-native-smoke/macos-arm64/candidate-smoke.json"
      - "target/public-cli-native-smoke/macos-arm64/ctx-macos-arm64.native-execution.json"

  - label: ":test_tube: public CLI macos-x64 exact-byte validation"
    key: "public-cli-macos-x64-native-smoke"
    depends_on: "public-cli-linux-factory"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1" && build.env("CTX_PUBLIC_CLI_NATIVE_SMOKE_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      scripts/buildkite/download-linux-factory-artifacts.sh "ctx-macos-x64*"
      scripts/validate-public-cli-factory-artifact.sh \
        macos-x64 target/public-cli-artifacts \
        target/public-cli-native-smoke/macos-x64
    agents:
      queue: "ctx-mac-gui-shared-x64"
      os: "darwin"
      arch: "x86_64"
    concurrency: 1
    concurrency_group: "ctx-public-cli-macos-intel-native"
    timeout_in_minutes: 180
    artifact_paths:
      - "target/public-cli-native-smoke/macos-x64/candidate-smoke.json"
      - "target/public-cli-native-smoke/macos-x64/ctx-macos-x64.native-execution.json"

  - label: ":package: Semantic macos-x64 runtime"
    key: "public-cli-macos-x64-runtime-producer"
    if: build.env("CTX_PUBLIC_SEMANTIC_ASSET_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      export CTX_MACOS_RELEASE_SIGNING=required
      export CTX_MACOS_SIGNING_SECRET_SOURCE=infisical
      scripts/build-onnxruntime-sidecar.sh macos-x64
      scripts/stage-github-release-assets.sh --transcode-runtime macos-x64
    agents:
      queue: "ctx-mac-gui-shared-x64"
      os: "darwin"
      arch: "x86_64"
    concurrency: 1
    concurrency_group: "ctx/public-cli-macos-x64-runtime-producer"
    timeout_in_minutes: 180
    artifact_paths:
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-x64*"

  - label: ":test_tube: public CLI windows-x64 exact-byte validation"
    key: "public-cli-windows-x64-native-smoke"
    depends_on: "public-cli-linux-factory"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1" && build.env("CTX_PUBLIC_CLI_NATIVE_SMOKE_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      scripts/buildkite/download-linux-factory-artifacts.sh "ctx.exe*"
      scripts/validate-public-cli-factory-artifact.sh \
        windows-x64 target/public-cli-artifacts \
        target/public-cli-native-smoke/windows-x64
    agents:
      queue: "windows-x64"
      os: "windows"
      arch: "x86_64"
    concurrency: 1
    concurrency_group: "ctx-public-cli-windows-native"
    timeout_in_minutes: 90
    artifact_paths:
      - "target/public-cli-native-smoke/windows-x64/candidate-smoke.json"
      - "target/public-cli-native-smoke/windows-x64/ctx-windows-x64.native-execution.json"

  - label: ":package: stage native-qualified Core release candidate"
    key: "github-release-candidate"
    depends_on:
      - "public-release"
      - "public-cli-linux-factory"
      - "public-cli-linux-x64-native-smoke"
      - "public-cli-linux-aarch64-native-smoke"
      - "public-cli-macos-arm64-native-smoke"
      - "public-cli-macos-x64-native-smoke"
      - "public-cli-windows-x64-native-smoke"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1" && build.env("CTX_PUBLIC_CLI_NATIVE_SMOKE_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      source_commit="$$(git rev-parse --verify HEAD^{commit})"
      scripts/buildkite/download-linux-factory-artifacts.sh "*"
      mkdir -p target/public-cli-artifacts
      buildkite-agent artifact download "target/public-cli-native-smoke/linux-x64/ctx-linux-x64.native-execution.json" . --step public-cli-linux-x64-native-smoke
      buildkite-agent artifact download "target/public-cli-native-smoke/linux-aarch64/ctx-linux-aarch64.native-execution.json" . --step public-cli-linux-aarch64-native-smoke
      buildkite-agent artifact download "target/public-cli-native-smoke/macos-arm64/ctx-macos-arm64.native-execution.json" . --step public-cli-macos-arm64-native-smoke
      buildkite-agent artifact download "target/public-cli-native-smoke/macos-x64/ctx-macos-x64.native-execution.json" . --step public-cli-macos-x64-native-smoke
      buildkite-agent artifact download "target/public-cli-native-smoke/windows-x64/ctx-windows-x64.native-execution.json" . --step public-cli-windows-x64-native-smoke
      CTX_PUBLIC_RELEASE_SOURCE_COMMIT="$${source_commit}" \
        scripts/stage-github-release-assets.sh \
          target/public-cli-artifacts \
          target/github-core-release-assets \
          target/github-release-authority \
          target/public-cli-native-smoke
    agents:
      queue: "release-linux-managed"
      ctx-runner-class: "release-linux-control"
      ctx-release-os: "ubuntu-24.04"
      ctx-release-nested-docker: "true"
      os: "linux"
      arch: "x86_64"
    timeout_in_minutes: 30
    artifact_paths:
      - "target/github-core-release-assets/*"
      - "target/github-release-authority/*"

  - label: ":package: Semantic ONNX models"
    key: "semantic-model-archives"
    if: build.env("CTX_PUBLIC_SEMANTIC_ASSET_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      mkdir -p target/public-cli-artifacts target/semantic-model-sources
      python3 scripts/semantic-release-assets.py prepare-model \
        --variant cpu-fp32 \
        --output-dir target/semantic-model-sources/cpu-fp32
      python3 scripts/semantic-release-assets.py build-model \
        --variant cpu-fp32 \
        --source target/semantic-model-sources/cpu-fp32 \
        --output-dir target/public-cli-artifacts
      python3 scripts/semantic-release-assets.py prepare-model \
        --variant accelerator-o4-fp16 \
        --output-dir target/semantic-model-sources/accelerator-o4-fp16
      python3 scripts/semantic-release-assets.py build-model \
        --variant accelerator-o4-fp16 \
        --source target/semantic-model-sources/accelerator-o4-fp16 \
        --output-dir target/public-cli-artifacts
    agents:
      queue: "release-linux-managed"
      ctx-runner-class: "release-linux-control"
      ctx-release-os: "ubuntu-24.04"
      ctx-release-nested-docker: "true"
      os: "linux"
      arch: "x86_64"
    timeout_in_minutes: 60
    artifact_paths:
      - "target/public-cli-artifacts/ctx-multilingual-e5-small-onnx-fp32-1.0.0.tar.xz"
      - "target/public-cli-artifacts/ctx-multilingual-e5-small-onnx-fp32-1.0.0.tar.xz.sha256"
      - "target/public-cli-artifacts/ctx-multilingual-e5-small-onnx-fp32-1.0.0.tar.xz.asset.json"
      - "target/public-cli-artifacts/ctx-multilingual-e5-small-onnx-o4-fp16-1.0.0.tar.xz"
      - "target/public-cli-artifacts/ctx-multilingual-e5-small-onnx-o4-fp16-1.0.0.tar.xz.sha256"
      - "target/public-cli-artifacts/ctx-multilingual-e5-small-onnx-o4-fp16-1.0.0.tar.xz.asset.json"

  - label: ":package: Semantic Core ML bundle"
    key: "semantic-coreml-archive"
    if: build.env("CTX_PUBLIC_SEMANTIC_ASSET_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      mkdir -p target/public-cli-artifacts
      python3 scripts/semantic-release-assets.py prepare-coreml \
        --output-dir target/semantic-coreml-source
      scripts/semantic-model-bundle/run-pinned-producer.sh \
        --tokenizer target/semantic-coreml-source/tokenizer.json \
        --document-model target/semantic-coreml-source/document.mlpackage \
        --query-model target/semantic-coreml-source/query.mlpackage \
        --model-license target/semantic-coreml-source/LICENSES/MODEL_LICENSE.txt \
        --bundle-version 1.0.0 \
        --document-batch-size 16 \
        --query-batch-size 1 \
        --sequence-length 512 \
        --output-dir target/semantic-coreml-bundle \
        --archive target/public-cli-artifacts/ctx-multilingual-e5-small-coreml-fp16-1.0.0.tar.xz
    agents:
      queue: "ctx-release-macos-arm64"
      os: "darwin"
      arch: "arm64"
    concurrency: 1
    concurrency_group: "ctx-public-semantic-coreml"
    timeout_in_minutes: 120
    artifact_paths:
      - "target/public-cli-artifacts/ctx-multilingual-e5-small-coreml-fp16-1.0.0.tar.xz"
      - "target/public-cli-artifacts/ctx-multilingual-e5-small-coreml-fp16-1.0.0.tar.xz.sha256"
      - "target/public-cli-artifacts/ctx-multilingual-e5-small-coreml-fp16-1.0.0.tar.xz.asset.json"

  - label: ":package: Semantic CUDA runtime"
    key: "semantic-runtime-linux-cuda12"
    if: build.env("CTX_PUBLIC_SEMANTIC_ASSET_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      scripts/build-onnxruntime-sidecar.sh linux-x64-cuda12
    agents:
      queue: "release-linux-managed"
      ctx-runner-class: "release-linux-control"
      ctx-release-os: "ubuntu-24.04"
      ctx-release-nested-docker: "true"
      os: "linux"
      arch: "x86_64"
    timeout_in_minutes: 60
    artifact_paths:
      - "target/public-cli-artifacts/ctx-onnxruntime-linux-x64-cuda12.tar.zst"
      - "target/public-cli-artifacts/ctx-onnxruntime-linux-x64-cuda12.tar.zst.sha256"
      - "target/public-cli-artifacts/ctx-onnxruntime-linux-x64-cuda12.tar.zst.asset.json"

  - label: ":package: Semantic Windows ML runtime"
    key: "semantic-runtime-windows-ml"
    if: build.env("CTX_PUBLIC_SEMANTIC_ASSET_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      bash scripts/build-onnxruntime-sidecar.sh windows-x64
      bash scripts/build-onnxruntime-sidecar.sh windows-x64-windowsml
      powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-windows-semantic-smoke-contract.ps1
    agents:
      queue: "windows-x64"
      os: "windows"
      arch: "x86_64"
    concurrency: 1
    concurrency_group: "ctx-public-semantic-windows-native"
    timeout_in_minutes: 90
    artifact_paths:
      - "target/public-cli-artifacts/ctx-onnxruntime-windows-x64.zip"
      - "target/public-cli-artifacts/ctx-onnxruntime-windows-x64.zip.sha256"
      - "target/public-cli-artifacts/ctx-windowsml-windows-x64.zip"
      - "target/public-cli-artifacts/ctx-windowsml-windows-x64.zip.sha256"
      - "target/public-cli-artifacts/ctx-windowsml-windows-x64.zip.asset.json"

  - label: ":package: Semantic portable CPU runtimes"
    key: "semantic-runtime-portable"
    if: build.env("CTX_PUBLIC_SEMANTIC_ASSET_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      export CTX_MACOS_RELEASE_SIGNING=required
      for runtime_platform in linux-x64 linux-aarch64 macos-arm64; do
        scripts/build-onnxruntime-sidecar.sh "$${runtime_platform}"
        case "$${runtime_platform}" in
          linux-*|macos-*)
            scripts/stage-github-release-assets.sh \
              --transcode-runtime "$${runtime_platform}"
            ;;
        esac
      done
    agents:
      queue: "release-linux-managed"
      ctx-runner-class: "release-linux-control"
      ctx-release-os: "ubuntu-24.04"
      ctx-release-nested-docker: "true"
      os: "linux"
      arch: "x86_64"
    timeout_in_minutes: 120
    artifact_paths:
      - "target/public-cli-artifacts/ctx-onnxruntime-linux-x64*"
      - "target/public-cli-artifacts/ctx-onnxruntime-linux-aarch64*"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64*"

  - label: ":test_tube: qualify final macos-arm64 CLI and runtime pair"
    key: "public-cli-macos-arm64-release-pair-qualification"
    depends_on:
      - "github-release-candidate"
      - "semantic-runtime-portable"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1" && build.env("CTX_PUBLIC_CLI_NATIVE_SMOKE_MATRIX") == "1" && build.env("CTX_PUBLIC_SEMANTIC_ASSET_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      mkdir -p target/github-core-release-assets target/public-cli-artifacts
      # Qualification and assembly consume only each step's current attempt.
      # Retrying either producer or this gate requires rerunning this gate and
      # final assembly; historical artifact attempts are never accepted.
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "target/github-core-release-assets/ctx-macos-arm64*" . \
        --step github-release-candidate
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.tar.gz*" . \
        --step semantic-runtime-portable
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.signing.json" . \
        --step semantic-runtime-portable
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.attestation.json" . \
        --step semantic-runtime-portable
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.attestation.cms" . \
        --step semantic-runtime-portable
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.release-attestation.json" . \
        --step semantic-runtime-portable
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.release-attestation.cms" . \
        --step semantic-runtime-portable
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.notary-submit.json" . \
        --step semantic-runtime-portable
      scripts/qualify-macos-release-pair.sh \
        macos-arm64 target/github-core-release-assets/ctx-macos-arm64 \
        target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.tar.gz \
        target/macos-release-pair-qualification/ctx-macos-arm64.release-pair.sha256
    agents:
      queue: "ctx-release-macos-arm64"
      os: "darwin"
      arch: "arm64"
    concurrency: 1
    concurrency_group: "ctx-public-cli-macos-arm64-release-pair"
    timeout_in_minutes: 180
    artifact_paths:
      - "target/macos-release-pair-qualification/ctx-macos-arm64.release-pair.sha256"

  - label: ":test_tube: qualify final macos-x64 CLI and runtime pair"
    key: "public-cli-macos-x64-release-pair-qualification"
    depends_on:
      - "github-release-candidate"
      - "public-cli-macos-x64-runtime-producer"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1" && build.env("CTX_PUBLIC_CLI_NATIVE_SMOKE_MATRIX") == "1" && build.env("CTX_PUBLIC_SEMANTIC_ASSET_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      mkdir -p target/github-core-release-assets target/public-cli-artifacts
      # Qualification and assembly consume only each step's current attempt.
      # Retrying either producer or this gate requires rerunning this gate and
      # final assembly; historical artifact attempts are never accepted.
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "target/github-core-release-assets/ctx-macos-x64*" . \
        --step github-release-candidate
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.tar.gz*" . \
        --step public-cli-macos-x64-runtime-producer
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.signing.json" . \
        --step public-cli-macos-x64-runtime-producer
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.attestation.json" . \
        --step public-cli-macos-x64-runtime-producer
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.attestation.cms" . \
        --step public-cli-macos-x64-runtime-producer
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.release-attestation.json" . \
        --step public-cli-macos-x64-runtime-producer
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.release-attestation.cms" . \
        --step public-cli-macos-x64-runtime-producer
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.notary-submit.json" . \
        --step public-cli-macos-x64-runtime-producer
      scripts/qualify-macos-release-pair.sh \
        macos-x64 target/github-core-release-assets/ctx-macos-x64 \
        target/public-cli-artifacts/ctx-onnxruntime-macos-x64.tar.gz \
        target/macos-release-pair-qualification/ctx-macos-x64.release-pair.sha256
    agents:
      queue: "ctx-mac-gui-shared-x64"
      os: "darwin"
      arch: "x86_64"
    concurrency: 1
    concurrency_group: "ctx-public-cli-macos-x64-release-pair"
    timeout_in_minutes: 180
    env:
      CTX_RELEASE_MACOS_X64_KVM_RUNNER_ID: "ctx-mac-gui-shared-x64"
    artifact_paths:
      - "target/macos-release-pair-qualification/ctx-macos-x64.release-pair.sha256"

  - label: ":package: assemble complete GitHub release assets"
    key: "github-release-assets"
    depends_on:
      - "github-release-candidate"
      - "semantic-runtime-portable"
      - "public-cli-macos-x64-runtime-producer"
      - "semantic-runtime-windows-ml"
      - "public-cli-macos-arm64-release-pair-qualification"
      - "public-cli-macos-x64-release-pair-qualification"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1" && build.env("CTX_PUBLIC_CLI_NATIVE_SMOKE_MATRIX") == "1" && build.env("CTX_PUBLIC_SEMANTIC_ASSET_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      mkdir -p target/public-cli-artifacts target/macos-release-pair-qualification
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "target/github-core-release-assets/*" . \
        --step github-release-candidate
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-linux-x64.tar.gz*" . \
        --step semantic-runtime-portable
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-linux-aarch64.tar.gz*" . \
        --step semantic-runtime-portable
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.tar.gz*" . \
        --step semantic-runtime-portable
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.tar.gz*" . \
        --step public-cli-macos-x64-runtime-producer
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "*ctx-onnxruntime-windows-x64.zip*" . \
        --step semantic-runtime-windows-ml
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "target/macos-release-pair-qualification/ctx-macos-arm64.release-pair.sha256" . \
        --step public-cli-macos-arm64-release-pair-qualification
      BUILDKITE_AGENT_INCLUDE_RETRIED_JOBS=false buildkite-agent artifact download \
        "target/macos-release-pair-qualification/ctx-macos-x64.release-pair.sha256" . \
        --step public-cli-macos-x64-release-pair-qualification
      scripts/assemble-github-release-assets.sh \
        target/github-core-release-assets \
        target/public-cli-artifacts \
        target/github-release-assets \
        target/macos-release-pair-qualification
    agents:
      queue: "release-linux-managed"
      ctx-runner-class: "release-linux-control"
      ctx-release-os: "ubuntu-24.04"
      ctx-release-nested-docker: "true"
      os: "linux"
      arch: "x86_64"
    timeout_in_minutes: 30
    artifact_paths:
      - "target/github-release-assets/*"

  - label: ":package: gather unsigned Semantic release handoff"
    key: "semantic-release-handoff"
    depends_on:
      - "semantic-model-archives"
      - "semantic-coreml-archive"
      - "semantic-runtime-linux-cuda12"
      - "semantic-runtime-windows-ml"
      - "semantic-runtime-portable"
      - "public-cli-macos-x64-runtime-producer"
    if: build.env("CTX_PUBLIC_SEMANTIC_ASSET_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      mkdir -p target/public-cli-artifacts
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-linux-x64.tar.zst*" . \
        --step semantic-runtime-portable
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-linux-aarch64*" . \
        --step semantic-runtime-portable
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.tar.zst*" . \
        --step semantic-runtime-portable
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-multilingual-e5-small-onnx-fp32-1.0.0.tar.xz*" . \
        --step semantic-model-archives
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-multilingual-e5-small-onnx-o4-fp16-1.0.0.tar.xz*" . \
        --step semantic-model-archives
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-multilingual-e5-small-coreml-fp16-1.0.0.tar.xz*" . \
        --step semantic-coreml-archive
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-linux-x64-cuda12.tar.zst*" . \
        --step semantic-runtime-linux-cuda12
      buildkite-agent artifact download \
        "*ctx-windowsml-windows-x64.zip*" . \
        --step semantic-runtime-windows-ml
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.tar.zst*" . \
        --step public-cli-macos-x64-runtime-producer
      scripts/stage-semantic-release-handoff.sh \
        target/public-cli-artifacts target/semantic-release-handoff
    agents:
      queue: "release-linux-managed"
      ctx-runner-class: "release-linux-control"
      ctx-release-os: "ubuntu-24.04"
      ctx-release-nested-docker: "true"
      os: "linux"
      arch: "x86_64"
    timeout_in_minutes: 30
    artifact_paths:
      - "target/semantic-release-handoff/*"
